<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Udyam Digital: implemented web architecture</title><desc id="diagram-description">Customer web interface and optional browser speech connect to a FastAPI backend. Backend rules own catalogue recommendations, pricing, document validation and simulated orders. Gemini supplies consented structured drafts and extracted fields. Source CSVs, SQLite records and temporary memory have distinct roles.</desc><defs><marker id="main-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad1930"/></marker><marker id="speech-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28618b"/></marker><marker id="provider-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#685095"/></marker><marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#23634d"/></marker></defs><rect width="1920" height="1280" fill="#fff"/><rect x="48" y="40" width="6" height="65" rx="3" fill="#ad1930"/><text x="72" y="75" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#20252e">Udyam Digital</text><text x="72" y="108" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#586675">Digital onboarding for Accel Business | implemented web prototype</text><text x="1260" y="72" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#685095">GEMINI: DRAFTS + EXTRACTION</text><text x="1260" y="104" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ad1930">BACKEND: RULES + DECISIONS</text><rect x="48" y="140" width="1824" height="48" rx="8" fill="#f5f7fa"/><text x="72" y="171" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#20252e">01 Review business needs</text><text x="452" y="171" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#20252e">02 Edit catalogue estimate</text><text x="900" y="171" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#20252e">03 Consent + document checks</text><text x="1400" y="171" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#20252e">04 Simulated order + tracker</text><text x="400" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">&gt;</text><text x="846" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">&gt;</text><text x="1345" y="171" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">&gt;</text><rect x="48" y="214" width="450" height="670" rx="14" fill="#f6f8fb" stroke="#28618b" stroke-width="1.5"/><text x="72" y="252" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#28618b">CUSTOMER / BROWSER</text><text x="72" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">React + TypeScript | responsive web app</text><rect x="560" y="214" width="790" height="670" rx="14" fill="#fcf6f7" stroke="#ad1930" stroke-width="1.5"/><text x="584" y="252" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">FASTAPI BACKEND</text><text x="584" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Authoritative rules, access checks and workflow</text><rect x="1410" y="214" width="462" height="670" rx="14" fill="#f8f6fc" stroke="#685095" stroke-width="1.5"/><text x="1434" y="252" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#685095">GEMINI API (EXTERNAL)</text><text x="1434" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Server-side adapter; HTTPS provider calls</text><rect x="48" y="968" width="1824" height="248" rx="14" fill="#f5f9f6" stroke="#23634d" stroke-width="1.5"/><text x="72" y="1006" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#23634d">LOCAL DATA + RETENTION</text><text x="72" y="1037" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Different stores for source rules, saved records and temporary fields</text><path d="M474 376H584" fill="none" stroke="#ad1930" stroke-width="2.5" marker-end="url(#main-arrow)" marker-start="url(#main-arrow)"/><text x="480" y="356" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#ad1930">JSON / images</text><path d="M272 518V490" fill="none" stroke="#28618b" stroke-width="2.5" marker-end="url(#speech-arrow)"/><path d="M272 664V714" fill="none" stroke="#28618b" stroke-width="2.5" marker-end="url(#speech-arrow)" marker-start="url(#speech-arrow)" stroke-dasharray="7 5"/><text x="290" y="695" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#28618b">Audio / transcript</text><path d="M1326 538H1378V391H1434" fill="none" stroke="#685095" stroke-width="2.5" marker-end="url(#provider-arrow)" marker-start="url(#provider-arrow)"/><path d="M1326 756H1388V502H1434" fill="none" stroke="#685095" stroke-width="2.5" marker-end="url(#provider-arrow)" marker-start="url(#provider-arrow)"/><path d="M967 543H943" fill="none" stroke="#ad1930" stroke-width="2.5" marker-end="url(#main-arrow)"/><path d="M967 758H943" fill="none" stroke="#ad1930" stroke-width="2.5" marker-end="url(#main-arrow)"/><path d="M584 584H530V926H322V968" fill="none" stroke="#23634d" stroke-width="2.5" marker-end="url(#data-arrow)" marker-start="url(#data-arrow)"/><text x="64" y="916" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#23634d">Read-only catalogue / registry lookups</text><path d="M950 884V928H887V968" fill="none" stroke="#23634d" stroke-width="2.5" marker-end="url(#data-arrow)" marker-start="url(#data-arrow)"/><text x="970" y="951" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#23634d">Save / reopen records</text><path d="M1146 864V916H1530V968" fill="none" stroke="#23634d" stroke-width="2.5" marker-end="url(#data-arrow)"/><text x="1560" y="947" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#23634d">Temporary fields</text><g data-card="72,312,402,178"><rect x="72" y="312" width="402" height="178" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="92" y="348" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20252e">Customer workspace</text><text x="92" y="385" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Create account / sign in; English / Hindi</text><text x="92" y="413" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Reviewed needs; editable bundle / quote</text><text x="92" y="441" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Document upload, checkout and tracker</text><text x="92" y="469" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Reviewed chat stays in the open tab</text></g><g data-card="72,518,402,146"><rect x="72" y="518" width="402" height="146" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="92" y="554" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#28618b">Optional voice input</text><text x="92" y="591" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Separate speech consent + permission</text><text x="92" y="619" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Editable transcript; owner confirms</text><text x="92" y="647" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Transcript becomes advisor description</text></g><g data-card="72,714,402,146"><rect x="72" y="714" width="402" height="146" rx="10" fill="#fff" stroke="#28618b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="92" y="750" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#28618b">Browser speech service</text><text x="92" y="787" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">en-IN / hi-IN recognition</text><text x="92" y="815" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">May use an external speech provider</text><text x="92" y="843" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Audio is not stored by this application</text></g><g data-card="584,312,742,120"><rect x="584" y="312" width="742" height="120" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="604" y="348" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">API boundary + account access</text><text x="604" y="385" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#586675">Validated schemas, request/rate limits and HttpOnly session cookie</text><text x="604" y="413" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#586675">Argon2id password hashes; account ownership and staff roles</text></g><g data-card="584,460,359,174"><rect x="584" y="460" width="359" height="174" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="604" y="496" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">Catalogue + quote rules</text><text x="604" y="533" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Select catalogue starter services</text><text x="604" y="561" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Eligibility and product dependencies</text><text x="604" y="589" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Quantities, fees and contract terms</text></g><g data-card="967,460,359,174"><rect x="967" y="460" width="359" height="174" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="987" y="496" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#685095">Advisor adapter</text><text x="987" y="533" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Consented text + reviewed facts</text><text x="987" y="561" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Bounded follow-up conversation</text><text x="987" y="589" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Validated draft; guided fallback</text></g><g data-card="584,674,359,190"><rect x="584" y="674" width="359" height="190" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="604" y="710" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">Order state machine</text><text x="604" y="747" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Passing checks + accepted terms</text><text x="604" y="775" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Recheck quote; prevent duplicates</text><text x="604" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Accepted &gt; installation &gt; activation</text><text x="604" y="831" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">All service stages are simulated</text></g><g data-card="967,674,359,190"><rect x="967" y="674" width="359" height="190" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="987" y="710" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ad1930">Document pipeline</text><text x="987" y="747" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">PNG/JPEG, max 5 MB; strip metadata</text><text x="987" y="775" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Extract fields; owner reviews</text><text x="987" y="803" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Mock registries, dates, consistency</text><text x="987" y="831" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Unresolved issues block checkout</text></g><g data-card="1434,312,414,244"><rect x="1434" y="312" width="414" height="244" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="1454" y="348" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#685095">Structured assistance</text><text x="1454" y="385" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Business text &gt; structured needs draft</text><text x="1454" y="413" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Document pixels &gt; extracted fields</text><text x="1454" y="441" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Backend validates returned JSON</text><text x="1454" y="469" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Provider never sets catalogue prices</text><text x="1454" y="497" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Provider never approves checkout</text></g><g data-card="1434,600,414,260"><rect x="1434" y="600" width="414" height="260" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="1454" y="636" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#685095">Provider controls</text><text x="1454" y="673" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">API key stays on the server</text><text x="1454" y="701" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Only consented text / pixels are sent</text><text x="1454" y="729" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">60-second request; one attempt</text><text x="1454" y="757" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Advisor outage: guided questions</text><text x="1454" y="785" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">OCR outage: retry; no guessed fields</text><text x="1454" y="813" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Provider data terms apply separately</text></g><g data-card="72,1054,500,138"><rect x="72" y="1054" width="500" height="138" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="92" y="1090" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#23634d">Read-only source CSVs</text><text x="92" y="1127" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">25 products + mock GSTIN / Udyam registries</text><text x="92" y="1155" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#586675">Deterministic catalogue and registry checks</text></g><g data-card="596,1054,594,146"><rect x="596" y="1054" width="594" height="146" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="616" y="1090" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#23634d">SQLite: two local databases</text><text x="616" y="1127" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">accounts.sqlite3: password hashes + hashed sessions</text><text x="616" y="1155" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">onboarding.sqlite3: consent, summaries, quotes, orders</text><text x="616" y="1183" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Journeys 24 h; sessions 8 h; inactive accounts 30 d</text></g><g data-card="1214,1054,634,146"><rect x="1214" y="1054" width="634" height="146" rx="10" fill="#fff" stroke="#d7dee7" stroke-width="1.5"/><text x="1234" y="1090" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#23634d">Temporary server memory</text><text x="1234" y="1127" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Extracted fields: up to 30 min; cleared on order submission</text><text x="1234" y="1155" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Document images are not persisted by the application</text><text x="1234" y="1183" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Raw fields are lost on server restart</text></g><text x="48" y="1245" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#586675">Demo scope: no real payment, availability check, installation or activation. Local SQLite is not encrypted.</text><text x="48" y="1272" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#586675">Additional web features: consented partner follow-up and authorized review. These are outside the main recorded flow.</text></svg>