" y="633" font-family="Arial" font-size="24" fill="#173e37">WhatsApp guided channel</text><text x="1132" y="669" font-family="Arial" font-size="19" fill="#566760">Signed ingress; gated reply adapter</text><text x="60" y="775" font-family="Arial" font-size="20" fill="#173e37">Retention: images never saved · raw fields 30 min · records 24 h · accounts / counters 30 d</text><text x="60" y="815" font-family="Arial" font-size="18" fill="#566760">Channel: encrypted answers 30 min idle / queued replies 10 min. No private record access. Payments and activation simulated.</text></svg>