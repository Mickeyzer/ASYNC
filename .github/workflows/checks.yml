name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix frontend
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_submission.py
      - run: python scripts/package_source.py
      - run: python -m pytest -q
      - run: python tests/browser_core_check.py
      - run: python tests/browser_onboarding_check.py
      - run: python tests/browser_operations_check.py
      - run: python tests/browser_conversation_security_check.py
      - run: python tests/browser_design_check.py
